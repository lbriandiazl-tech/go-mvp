services:
  - type: web
    name: vaka-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # base en Neon (gratis); se carga a mano en Render
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: VAKA_BANK_DETAILS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        value: hola@vaka.uy

databases:
  - name: vaka-mvp-db
    plan: free
