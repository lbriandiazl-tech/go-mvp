<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gift.occasion }} — Vaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B26; --navy-deep:#0A131C; --cream:#F4EFE4;
    --gold:#B98D34; --gold-soft:#D8B872;
    --line:rgba(244,239,228,0.14); --ink-soft:rgba(244,239,228,0.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{ min-height:100vh; background:var(--navy); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; }
  .screen{ position:relative; min-height:100vh; }
  .wordmark{ position:absolute; top:34px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:4px; color:var(--gold-soft); font-weight:600; z-index:5; opacity:0; animation:fadeUp .6s ease .1s forwards; }
  .stage{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px 60px; text-align:center; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  #step-closed{ transition:opacity .35s ease; }
  .greeting{ font-family:'Fraunces', serif; font-size:26px; color:var(--cream); line-height:1.3; opacity:0; animation:fadeUp .6s ease .2s forwards; }
  .from-line{ font-size:13px; color:var(--ink-soft); margin-top:12px; margin-bottom:40px; max-width:320px; line-height:1.55; opacity:0; animation:fadeUp .6s ease .35s forwards; }
  .from-line b{ color:var(--gold-soft); font-weight:600; }

  .tap-box{ width:184px; height:164px; position:relative; cursor:pointer; opacity:0; animation:fadeUp .7s ease .5s forwards; transition:transform .15s ease; margin:0 auto; }
  .tap-box:active{ transform:scale(.94); }
  .box-outline{ fill:none; stroke:var(--gold-soft); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
  .box-seal{ fill:var(--gold); }
  .tap-box svg{ width:100%; height:100%; animation: floatBox 2.8s ease-in-out infinite; }
  @keyframes floatBox{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-6px) rotate(-1deg);} }

  .tap-hint{ margin-top:28px; font-size:12.5px; color:var(--gold-soft); letter-spacing:.3px; opacity:0; animation: hintIn .6s ease .9s forwards, pulseHint 1.8s ease-in-out 1.5s infinite; }
  @keyframes hintIn{ to{opacity:.85;} }
  @keyframes pulseHint{ 0%,100%{opacity:.4;} 50%{opacity:.9;} }

  #step-open{ opacity:0; pointer-events:none; }
  .unbox-stage{ position:relative; width:212px; height:198px; margin:0 auto; }
  .box-side{ position:absolute; bottom:0; right:12px; width:21px; height:68px; background:rgba(0,0,0,.28); border:1.4px solid var(--gold-soft); border-left:none; transform:skewY(30deg); transform-origin:bottom left; }
  .box-base{ position:absolute; bottom:0; left:24px; right:36px; height:68px; border:1.4px solid var(--gold-soft); border-top:none; }
  .box-lid{ position:absolute; bottom:68px; left:19px; right:30px; height:18px; border:1.4px solid var(--gold-soft); background:linear-gradient(180deg,var(--navy) 55%, rgba(0,0,0,.25)); transition:transform .6s cubic-bezier(.2,.8,.3,1), opacity .6s ease; }
  .lid-off{ transform:translate(17px,-55px) rotate(-20deg); opacity:0; }
  .ribbon-v{ position:absolute; bottom:0; left:50%; width:10.5px; height:86px; margin-left:-5.25px; background:linear-gradient(180deg,var(--gold-soft),var(--gold)); transition:transform .5s ease, opacity .5s ease; }
  .ribbon-h{ position:absolute; bottom:23px; left:24px; right:36px; height:9.5px; background:linear-gradient(90deg,var(--gold-soft),var(--gold)); transition:transform .5s ease, opacity .5s ease; }
  .ribbon-split-v{ transform:scaleX(0); opacity:0; }
  .ribbon-split-h{ transform:scaleY(0); opacity:0; }
  .bow{ position:absolute; bottom:79px; left:50%; width:32px; height:26px; margin-left:-16px; transition:transform .6s cubic-bezier(.2,.8,.3,1), opacity .6s ease; }
  .bow svg{ width:100%; height:100%; }
  .bow svg *{ stroke:var(--gold); fill:none; stroke-width:1.4; }
  .glow{ position:absolute; top:-8px; left:50%; width:176px; height:176px; margin-left:-88px; border-radius:50%; background:radial-gradient(circle, rgba(216,184,114,.26), transparent 70%); opacity:0; transition:opacity .8s ease; }
  .glow.show{ opacity:1; }

  .reveal-cards{ position:absolute; top:0; left:0; right:0; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .r-card{ border:1.5px solid var(--line); padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; opacity:0; transform:scale(.9); transition:opacity .4s ease, transform .25s ease, border-color .25s ease, background .25s ease; cursor:pointer; }
  .r-card.show{ opacity:1; transform:scale(1); }
  .r-card.selected{ border-color:var(--gold); background:rgba(185,141,52,0.12); transform:scale(1.03); }
  .r-card svg{ width:18px; height:18px; transition:stroke .25s ease; }
  .r-card svg *{ stroke:var(--cream); fill:none; stroke-width:1.3; }
  .r-card.selected svg *{ stroke:var(--gold-soft); }
  .r-card span{ font-size:10px; color:var(--ink-soft); }

  .below-cards{ margin-top:20px; width:100%; display:flex; flex-direction:column; align-items:center; }
  .catalog-cta{ background:transparent; border:1.3px solid var(--line); color:var(--ink-soft); font-size:13.5px; font-weight:600; padding:13px 28px; transition:all .3s ease; width:100%; max-width:230px; pointer-events:none; text-decoration:none; text-align:center; }
  .catalog-cta.ready{ background:var(--gold); border-color:var(--gold); color:var(--navy-deep); pointer-events:auto; }
  .catalog-cta:active{ transform:scale(.97); }
</style>
</head>
<body>

<div class="screen">
<div class="wordmark">Vaka</div>

<div class="stage" id="step-closed">
  <div class="greeting">{{ gift.occasion }}</div>
  <div class="from-line">{{ gift.recipient_name }}, tenés un regalo de parte de<br><b>{{ contributors_line }}</b></div>
  <div class="tap-box" id="tapBox">
    <svg viewBox="0 0 48 48">
      <path class="box-outline" d="M9 41 V23 H6 V18 H42 V23 H39 V41 Z"/>
      <path class="box-outline" d="M21 18 V41 M27 18 V41"/>
      <path class="box-outline" d="M24 18c-4-7-13-5-12 0 c0.6 3 5 3.5 9 2 M24 18c4-7 13-5 12 0 c-0.6 3-5 3.5-9 2"/>
      <circle class="box-seal" cx="24" cy="17.3" r="1.6"/>
    </svg>
  </div>
  <div class="tap-hint">Tocá para abrir tu regalo</div>
</div>

<div class="stage" id="step-open">
  <div class="unbox-stage">
    <div class="box-side"></div>
    <div class="box-base"></div>
    <div class="ribbon-h" id="ribbonH"></div>
    <div class="ribbon-v" id="ribbonV"></div>
    <div class="box-lid" id="lid"></div>
    <div class="bow" id="bow">
      <svg viewBox="0 0 32 26"><path d="M16 13c-4-9-14-6-13 0s8 4 13 0zM16 13c4-9 14-6 13 0s-8 4-13 0z"/><path d="M16 13l-4 10M16 13l4 10"/><circle cx="16" cy="13" r="2.2"/></svg>
    </div>
    <div class="glow" id="glow"></div>
    <div class="reveal-cards" id="cards">
      <div class="r-card" data-cat="Viajes"><svg viewBox="0 0 24 24"><path d="M2 13l19-9-8 19-3-8-8-2z"/></svg><span>Viajes</span></div>
      <div class="r-card" data-cat="Indumentaria"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><path d="M12 6.5v2M4 20l8-7 8 7M4 20h16"/></svg><span>Indumentaria</span></div>
      <div class="r-card" data-cat="Gastronomía"><svg viewBox="0 0 24 24"><path d="M6 2v7c0 1.5 1 2 1 3v10M9 2v7c0 1.5-1 2-1 3M17 2c1.5 2 1.5 6 0 8v12"/></svg><span>Gastronomía</span></div>
      <div class="r-card" data-cat="Espectáculos"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M12 7v10" stroke-dasharray="2 2"/></svg><span>Espectáculos</span></div>
    </div>
  </div>
  <div class="below-cards">
    <a class="catalog-cta" id="cta" href="#">Elegí una categoría</a>
  </div>
</div>
</div>

<script>
  const tapBox = document.getElementById('tapBox');
  const stepClosed = document.getElementById('step-closed');
  const stepOpen = document.getElementById('step-open');
  const lid = document.getElementById('lid');
  const bow = document.getElementById('bow');
  const ribbonV = document.getElementById('ribbonV');
  const ribbonH = document.getElementById('ribbonH');
  const glow = document.getElementById('glow');
  const cards = document.querySelectorAll('.r-card');
  const cta = document.getElementById('cta');
  const catalogBaseUrl = "{{ url_for('catalog_view', slug=gift.slug) }}";

  function openGift(){
    stepClosed.style.opacity = '0';
    stepClosed.style.pointerEvents = 'none';
    stepOpen.style.opacity = '1';
    stepOpen.style.pointerEvents = 'auto';
    setTimeout(() => {
      lid.classList.add('lid-off');
      bow.classList.add('lid-off');
      ribbonV.classList.add('ribbon-split-v');
      ribbonH.classList.add('ribbon-split-h');
    }, 300);
    setTimeout(() => glow.classList.add('show'), 500);
    cards.forEach((c, i) => setTimeout(() => c.classList.add('show'), 900 + i * 150));
  }

  function selectCard(card){
    cards.forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    const cat = card.dataset.cat;
    cta.textContent = 'Continuar con ' + cat + ' →';
    cta.href = catalogBaseUrl + '?categoria=' + encodeURIComponent(cat);
    cta.classList.add('ready');
  }

  tapBox.addEventListener('click', openGift);
  cards.forEach(c => c.addEventListener('click', () => { if(c.classList.contains('show')) selectCard(c); }));
</script>
</body>
</html>
