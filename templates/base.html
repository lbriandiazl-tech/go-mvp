<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GO — Regalos en grupo{% endblock %}</title>
<meta name="description" content="{% block description %}Armá una vaquita para un regalo grupal en minutos. Fácil de organizar, transparente para todos.{% endblock %}">
<meta property="og:title" content="{% block og_title %}GO — Regalos en grupo{% endblock %}">
<meta property="og:description" content="{% block og_description %}Armá una vaquita para un regalo grupal en minutos.{% endblock %}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#101B26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B26; --navy-deep:#0A131C; --cream:#F4EFE4; --paper:#EFEAE0;
    --gold:#B98D34; --gold-soft:#D8B872;
    --line:rgba(16,27,38,0.12); --line-dark:rgba(244,239,228,0.14);
    --ink-muted:#8A8272; --ink-soft:rgba(244,239,228,0.62);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--navy); }
  .serif{ font-family:'Fraunces', serif; }
  a{ color:inherit; }

  .navy-page{ background:var(--navy); min-height:100vh; color:var(--cream); }
  .wrap{ max-width:480px; margin:0 auto; padding:56px 24px 60px; }
  .wordmark{ text-align:center; font-size:12px; letter-spacing:4px; color:var(--gold-soft); font-weight:700; margin-bottom:40px; }

  h1.headline{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; line-height:1.3; text-align:center; margin:0 0 12px; }
  p.subline{ text-align:center; color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 34px; }
  .navy-page p.subline{ color:var(--ink-soft); }
  .paper-page p.subline, .paper-page .sub{ color:var(--ink-muted); }

  .paper-page{ background:var(--paper); min-height:100vh; color:var(--navy); }
  .paper-page h1.headline{ color:var(--navy); }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin:18px 0 6px; }
  input, textarea{
    width:100%; padding:13px 14px; font-size:15px; font-family:'Inter',sans-serif;
    border:1.4px solid var(--line); background:#fff; color:var(--navy); border-radius:2px;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--gold); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--gold); color:var(--navy-deep); font-weight:700; font-size:14.5px;
    padding:14px 26px; border:none; cursor:pointer; width:100%; margin-top:26px;
    text-decoration:none; border-radius:2px;
  }
  .btn:active{ transform:scale(.98); }
  .btn-ghost{
    background:transparent; border:1.4px solid var(--line); color:var(--navy);
  }
  .navy-page .btn-ghost{ border-color:var(--line-dark); color:var(--cream); }

  .flash{ background:#FBE8D8; border:1px solid #E0AA6E; color:#7A4A16; padding:10px 14px; font-size:13px; margin-bottom:16px; border-radius:2px; }

  .rule{ width:34px; height:1px; background:var(--gold); margin:20px auto; }

  .card{ background:#fff; border:1px solid var(--line); padding:22px; margin-top:18px; border-radius:2px; }
  .navy-page .card{ background:rgba(244,239,228,0.04); border-color:var(--line-dark); }

  .progress-track{ width:100%; height:6px; background:rgba(244,239,228,0.12); margin:14px 0; }
  .paper-page .progress-track{ background:var(--line); }
  .progress-fill{ height:100%; background:var(--gold); transition:width .4s ease; }

  .muted{ color:var(--ink-soft); font-size:12.5px; }
  .paper-page .muted{ color:var(--ink-muted); }

  table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-muted); padding:8px 6px; border-bottom:1px solid var(--line); }
  td{ padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .status-pill{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .status-pending{ background:#FBE8D8; color:#7A4A16; }
  .status-confirmed{ background:#DCEFE3; color:#1E6B45; }
  .btn-small{ font-size:12px; padding:7px 12px; width:auto; margin:0; }

  code.ref{ font-family:monospace; background:rgba(185,141,52,0.12); color:var(--gold); padding:3px 8px; font-weight:700; letter-spacing:.5px; }

  /* --- home: secciones de contenido --- */
  .hero-icon{ width:64px; height:64px; margin:0 auto 18px; }
  .hero-icon svg{ width:100%; height:100%; }
  .hero-icon svg *{ stroke:var(--gold-soft); fill:none; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }

  .section{ margin-top:56px; }
  .section-title{ font-family:'Fraunces', serif; font-size:20px; text-align:center; color:var(--cream); margin-bottom:30px; }

  .steps3{ display:flex; gap:14px; }
  .step3{ flex:1; text-align:center; }
  .step3-num{ font-family:'Fraunces', serif; color:var(--gold); font-size:13px; margin-bottom:8px; }
  .step3-icon{ width:32px; height:32px; margin:0 auto 10px; }
  .step3-icon svg{ width:100%; height:100%; }
  .step3-icon svg *{ stroke:var(--cream); fill:none; stroke-width:1.3; }
  .step3-label{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .feature-row{ display:flex; gap:14px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--line-dark); }
  .feature-row:last-child{ border-bottom:none; }
  .feature-icon{ width:26px; height:26px; flex-shrink:0; margin-top:2px; }
  .feature-icon svg{ width:100%; height:100%; }
  .feature-icon svg *{ stroke:var(--gold-soft); fill:none; stroke-width:1.5; }
  .feature-text b{ display:block; color:var(--cream); font-size:14px; margin-bottom:3px; }
  .feature-text span{ color:var(--ink-soft); font-size:12.5px; line-height:1.5; }

  details.faq{ border-bottom:1px solid var(--line-dark); padding:16px 0; }
  details.faq summary{ font-size:14px; color:var(--cream); cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  details.faq summary::-webkit-details-marker{ display:none; }
  details.faq summary::after{ content:'+'; color:var(--gold-soft); font-size:18px; font-weight:400; margin-left:12px; }
  details.faq[open] summary::after{ content:'−'; }
  details.faq p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin-top:10px; }
</style>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
</body>
</html>
